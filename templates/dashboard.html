<!DOCTYPE html>
<html lang="en">
<head>
    <title>Trading Dashboard - Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #f5f6fa; color: #333; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 2.5em; color: #2c3e50; text-align: center; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; }
        .tab { overflow: hidden; background-color: #34495e; border-radius: 5px 5px 0 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab button { float: left; border: none; outline: none; padding: 14px 24px; cursor: pointer; font-size: 1.1em; color: #fff; background-color: inherit; transition: background-color 0.3s; }
        .tab button:hover { background-color: #465c71; }
        .tab button.active { background-color: #4a90e2; }
        .tabcontent { display: none; padding: 20px; background-color: #fff; border: 1px solid #ddd; border-radius: 0 0 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .loading { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2em; color: #4a90e2; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: #fff; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        form { background-color: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form label { font-weight: bold; color: #2c3e50; margin-bottom: 8px; display: block; }
        form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; transition: border-color 0.3s; }
        form input:focus { border-color: #4a90e2; outline: none; }
        form button { padding: 10px 20px; background-color: #4a90e2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; transition: background-color 0.3s; }
        form button:hover { background-color: #357abd; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4a90e2; }
        input:checked + .slider:before { transform: translateX(26px); }
        .delete-btn { background-color: #e74c3c; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; }
        .delete-btn:hover { background-color: #c0392b; }
        .apply-btn { background-color: #2ecc71; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; margin-left: 10px; }
        .apply-btn:hover { background-color: #27ae60; }
        .pnl-display { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 20px 0; font-size: 1.5em; font-weight: bold; background-color: #f8f9fa; padding: 10px; border-radius: 5px; }
        .pnl-value { font-size: 2em; }
        .pnl-percentage { font-size: 1.2em; }
        .error-message { display: none; color: #e74c3c; font-weight: bold; text-align: center; margin: 10px 0; }
        .logout-btn { float: right; padding: 14px 24px; background-color: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s; }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trading Dashboard - Admin</h1>
        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'OpenPositions')" id="defaultOpen">Open Positions</button>
            <button class="tablinks" onclick="openTab(event, 'AccountConfig')">Account Config</button>
            <button class="tablinks" onclick="openTab(event, 'APIManagement')">API Management</button>
            <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
        </div>

        <div id="OpenPositions" class="tabcontent">
            <h2>Open Positions</h2>
            <div class="error-message" id="positions-error"></div>
            <div class="pnl-display">
                <span class="pnl-value">0.00</span>
                <span class="pnl-percentage">(0.00%)</span>
            </div>
            <div class="loading" id="positions-loading">Loading...</div>
            <table id="positions">
                <tr><th>User ID</th><th>Symbol</th><th>Size USDT</th><th>Entry Price</th><th>Mark Price</th><th>PNL (%)</th><th>SL/TSL Price</th></tr>
            </table>
        </div>

        <div id="AccountConfig" class="tabcontent">
            <h2>Account Config</h2>
            <div class="error-message" id="config-error"></div>
            <div class="loading" id="config-loading">Loading...</div>
            <table id="config">
                <tr><th>User ID</th><th>Status</th><th>Multiplier</th><th>Leverage</th><th>Actions</th></tr>
                {% for config in config_data %}
                    <tr>
                        <td>{{ config.user_id }}</td>
                        <td>
                            <label class="toggle-switch">
                                <input type="checkbox" id="toggle_{{ config.user_id }}" {{ 'checked' if config.status else '' }} onchange="updateStatus('{{ config.user_id }}', this.checked)">
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td>
                            <input type="number" id="multiplier_{{ config.user_id }}" value="{{ config.multiplier }}" step="0.1" min="0">
                            <button class="apply-btn" onclick="applyMultiplier('{{ config.user_id }}')">Apply</button>
                        </td>
                        <td>
                            <input type="number" id="leverage_{{ config.user_id }}" value="{{ config.leverage }}" step="1" min="1">
                            <button class="apply-btn" onclick="applyLeverage('{{ config.user_id }}')">Apply</button>
                        </td>
                        <td><button class="delete-btn" onclick="deleteAccount('{{ config.user_id }}')">Delete</button></td>
                    </tr>
                {% endfor %}
            </table>
        </div>

        <div id="APIManagement" class="tabcontent">
            <h2>API Management</h2>
            <div class="error-message" id="api-error"></div>
            <form id="apiForm">
                <label for="user_id">User ID:</label>
                <input type="text" id="user_id" name="user_id" placeholder="Enter User ID" required>
                <label for="api_key">API Key:</label>
                <input type="text" id="api_key" name="api_key" placeholder="Enter your Binance API Key" required>
                <label for="api_secret">API Secret:</label>
                <input type="text" id="api_secret" name="api_secret" placeholder="Enter your Binance API Secret" required>
                <label for="multiplier">Multiplier (default 1.0):</label>
                <input type="number" id="multiplier" name="multiplier" step="0.1" value="1.0" min="0">
                <label for="leverage">Leverage (default 1):</label>
                <input type="number" id="leverage" name="leverage" min="1" value="1" required>
                <button type="submit">Register API Details</button>
            </form>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var tabcontent = document.getElementsByClassName("tabcontent");
            for (var i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
            var tablinks = document.getElementsByClassName("tablinks");
            for (var i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(" active", "");
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
            if (tabName === 'AccountConfig') updateConfig();
            if (tabName === 'OpenPositions') updateOpenPositions();
        }

        document.getElementById("defaultOpen").click();

        function updateTable(tableId, data, columns) {
            const table = document.getElementById(tableId);
            while (table.rows.length > 1) table.deleteRow(1);
            if (!data || !data.positions) return;
            data.positions.forEach(row => {
                let tr = table.insertRow();
                columns.forEach(col => {
                    let td = tr.insertCell();
                    td.textContent = row[col] !== undefined ? row[col] : 'N/A';
                });
            });
        }

        function showError(tabId, message) {
            const errorDiv = document.getElementById(`${tabId}-error`);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }

        function handleError(tabId, error, message) {
            console.error(message, error);
            showError(tabId, `${message}: ${error.message || error}`);
        }

        function updateConfig() {
            document.getElementById('config-loading').style.display = 'block';
            fetch('/config', { credentials: 'include' })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    // Update dynamically if needed, but initial render is from Jinja
                    document.getElementById('config-loading').style.display = 'none';
                })
                .catch(error => handleError('config', error, 'Failed to fetch account config'))
                .finally(() => document.getElementById('config-loading').style.display = 'none');
        }

        function updateOpenPositions() {
            document.getElementById('positions-loading').style.display = 'block';
            fetch('/open_positions', { credentials: 'include' })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    updateTable('positions', data, ['user_id', 'symbol', 'size_usdt', 'entry_price', 'mark_price', 'pnl_percent', 'sl_tsl_price']);
                    const pnlDisplay = document.querySelector('.pnl-display');
                    const pnlValue = pnlDisplay.querySelector('.pnl-value');
                    const pnlPercentage = pnlDisplay.querySelector('.pnl-percentage');
                    const totalPnl = data.total_pnl.split(' ')[0];
                    const pnlColor = parseFloat(totalPnl) > 0 ? 'green' : parseFloat(totalPnl) < 0 ? 'red' : 'black';
                    pnlValue.style.color = pnlColor;
                    pnlPercentage.style.color = pnlColor;
                    pnlValue.textContent = totalPnl;
                    pnlPercentage.textContent = data.total_pnl.match(/\(([^)]+)\)/)[1];
                })
                .catch(error => handleError('positions', error, 'Failed to fetch open positions'))
                .finally(() => document.getElementById('positions-loading').style.display = 'none');
        }

        function updateStatus(userId, isChecked) {
            fetch('/update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, status: isChecked ? 1 : 0 }),
                credentials: 'include'
            }).then(response => response.json())
              .then(data => { if (data.error) showError('config', data.error); else updateConfig(); })
              .catch(error => handleError('config', error, 'Failed to update status'));
        }

        function applyMultiplier(userId) {
            const multiplier = parseFloat(document.getElementById(`multiplier_${userId}`).value) || 1.0;
            if (multiplier < 0) { showError('config', "Multiplier must be non-negative"); return; }
            fetch('/update_multiplier', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, multiplier: multiplier }),
                credentials: 'include'
            }).then(response => response.json())
              .then(data => { if (data.error) showError('config', data.error); else updateConfig(); })
              .catch(error => handleError('config', error, 'Failed to update multiplier'));
        }

        function applyLeverage(userId) {
            const leverage = parseInt(document.getElementById(`leverage_${userId}`).value) || 1;
            if (leverage < 1) { showError('config', "Leverage must be at least 1"); return; }
            fetch('/update_leverage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, leverage: leverage }),
                credentials: 'include'
            }).then(response => response.json())
              .then(data => { if (data.error) showError('config', data.error); else updateConfig(); })
              .catch(error => handleError('config', error, 'Failed to update leverage'));
        }

        function deleteAccount(userId) {
            if (confirm(`Are you sure you want to delete ${userId}?`)) {
                fetch('/delete_account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId }),
                    credentials: 'include'
                }).then(response => response.json())
                  .then(data => { if (data.error) showError('config', data.error); else { showError('config', data.message); updateConfig(); } })
                  .catch(error => handleError('config', error, 'Failed to delete account'));
            }
        }

        document.getElementById('apiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/save_api', {
                method: 'POST',
                body: new FormData(this),
                credentials: 'include'
            }).then(response => response.json())
              .then(data => { if (data.error) showError('api', data.error); else { showError('api', data.message); updateConfig(); } })
              .catch(error => handleError('api', error, 'Failed to save API details'));
        });

        setInterval(() => {
            if (document.getElementById('AccountConfig').style.display === 'block') updateConfig();
            if (document.getElementById('OpenPositions').style.display === 'block') updateOpenPositions();
        }, 5000);
    </script>
</body>
</html>
